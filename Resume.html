<!doctype html>
<html lang="en">
  <head>
    <title>Projects</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Using Bootstrap 5 framework -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- jQuery used to load the navbar -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>

  <body>
    <!-- Navbar gets added here -->
    <div id="nav-placeholder"></div>
    <!-- Web page content goes inside Bootstrap container(s) -->
    <body class="bg-black text-white"></body>

    <script>
      // Load only the #site-nav element from navbar.html
      $("#nav-placeholder").load("navbar.html #site-nav");
    </script>

    <section class="container my-5">
      <div class="row justify-content-center">
        <div class="col-11 col-md-6 col-lg-5">
          <img
            src="images/resumeplaceholder.jpg"
            class="img-fluid rounded border"
            alt="Describe what the photo shows"
          />
        </div>
      </div>

      <div class="text-center mt-4">
        <a
          href="files/isaac-castillo-resume.pdf"
          download="Isaac-Castillo-Resume.pdf"
          class="btn btn-outline-light btn-lg"
          >Download Resume (PDF)</a
        >
      </div>
    </section>
  </body>
</html>
